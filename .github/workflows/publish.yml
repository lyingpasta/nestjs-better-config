name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need history and earlier tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify tarball contains the package entry
        # Lists the real tarball rather than parsing `npm pack --json`, whose
        # shape changed in npm 12.
        run: |
          TARBALL="$(npm pack --silent)"
          if ! tar -tzf "$TARBALL" | grep -qx 'package/dist/index.js'; then
            echo "dist/index.js missing from $TARBALL — refusing to publish." >&2
            tar -tzf "$TARBALL" >&2
            exit 1
          fi
          rm "$TARBALL"
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm publish --access public # auth + provenance via OIDC trusted publisher
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" |
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file -
